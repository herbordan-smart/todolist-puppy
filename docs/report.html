<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="demo-shim.js"></script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>我的任务报告</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --warm-white: #FFFDF5; --soft-yellow: #FFE566; --blush-pink: #FFB5C8;
      --light-gray: #F5F0E8; --text-primary: #5C4A3A; --text-secondary: #A09080;
      --border-color: #EDE8DF; --color-done: #52C41A; --color-done-bg: #F6FFED;
      --color-doing: #FFB800; --color-todo: #C0B4A8; --timeline-gray: #E0DCD5;
    }
    body { font-family: system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif; background:var(--warm-white); color:var(--text-primary); min-height:100vh; padding:24px; }
    .report-header { max-width:1100px; margin:0 auto 24px; text-align:center; }
    .report-header h1 { font-size:24px; margin-bottom:8px; }
    .view-tabs { display:inline-flex; gap:4px; background:var(--light-gray); border-radius:12px; padding:4px; }
    .view-tabs button { padding:8px 20px; border:none; background:transparent; border-radius:10px; font-size:14px; font-weight:500; cursor:pointer; color:var(--text-secondary); transition:all 0.2s; }
    .view-tabs button.active { background:var(--soft-yellow); color:#7A6000; font-weight:600; }
    .view-tabs button:hover:not(.active) { background:rgba(255,229,102,0.3); }
    .view-container { max-width:1100px; margin:0 auto; display:none; }
    .view-container.active { display:block; }
    .cal-wrapper { background:white; border-radius:16px; padding:20px; border:1px solid var(--border-color); }
    .cal-level-tabs { display:flex; gap:4px; margin-bottom:16px; background:var(--light-gray); border-radius:10px; padding:4px; width:fit-content; }
    .cal-level-btn { padding:6px 20px; border:none; background:transparent; border-radius:8px; font-size:14px; font-weight:500; cursor:pointer; color:var(--text-secondary); transition:all 0.2s; }
    .cal-level-btn.active { background:var(--soft-yellow); color:#7A6000; font-weight:600; }
    .cal-level-btn:hover:not(.active) { background:rgba(255,229,102,0.3); }
    .year-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
    .mini-month { border-radius:12px; padding:10px; background:#FAFAF5; border:1px solid var(--border-color); transition:box-shadow 0.15s; }
    .mini-month:hover { box-shadow:0 4px 16px rgba(0,0,0,.08); }
    .mini-month-header { font-size:13px; font-weight:600; color:var(--text-primary); margin-bottom:4px; cursor:pointer; text-align:center; }
    .mini-month-header:hover { color:var(--color-doing); }
    .mini-weekdays { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:10px; color:var(--text-secondary); font-weight:500; margin-bottom:2px; }
    .mini-dates { display:grid; grid-template-columns:repeat(7,1fr); gap:1px; }
    .mini-date { aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--text-secondary); border-radius:50%; cursor:pointer; transition:background 0.1s; }
    .mini-date:hover { background:rgba(255,229,102,0.3); }
    .mini-date.today { border:1.5px solid var(--blush-pink); font-weight:700; color:var(--text-primary); }
    .mini-date.heat-1 { background:rgba(255,229,102,0.2); color:var(--text-primary); font-weight:500; }
    .mini-date.heat-2 { background:rgba(255,229,102,0.4); color:var(--text-primary); font-weight:500; }
    .mini-date.heat-3 { background:rgba(255,229,102,0.6); color:var(--text-primary); font-weight:500; }
    .mini-date.heat-4 { background:rgba(255,229,102,0.8); color:var(--text-primary); font-weight:500; }
    .mini-date.heat-5 { background:#FFB800; color:white; font-weight:600; }
    .mini-date.heat-6 { background:#FFA000; color:white; font-weight:600; }
    .year-nav,.month-nav,.day-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .year-nav h2,.month-nav h2,.day-nav h2 { font-size:18px; font-weight:700; }
    .year-nav button,.month-nav button,.day-nav button { padding:6px 14px; border:1px solid var(--border-color); background:white; border-radius:8px; cursor:pointer; font-size:13px; margin-left:4px; }
    .year-nav button:hover,.month-nav button:hover,.day-nav button:hover { background:var(--light-gray); }
    .month-view { display:none; } .month-view.active { display:block; }
    .year-view.hidden { display:none; }
    .day-view { display:none; } .day-view.active { display:block; }
    .month-weekdays { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:4px; }
    .month-weekdays span { text-align:center; font-size:12px; font-weight:600; color:var(--text-secondary); padding:4px; }
    .month-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
    .month-day { min-height:90px; border-radius:10px; padding:6px; cursor:pointer; transition:background 0.15s; border:1px solid transparent; overflow:hidden; }
    .month-day:hover { background:var(--light-gray); }
    .month-day.empty { cursor:default; background:transparent !important; border:none; pointer-events:none; }
    .month-day.today { border-color:var(--blush-pink); background:rgba(255,181,200,0.08); }
    .month-day-num { font-size:13px; font-weight:600; color:var(--text-secondary); margin-bottom:4px; }
    .month-day.today .month-day-num { color:var(--text-primary); }
    .month-day-tasks { display:flex; flex-direction:column; gap:2px; overflow:hidden; }
    .task-label { font-size:9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:1px 4px; border-radius:2px; }
    .task-label.done { background:var(--color-done-bg); color:var(--color-done); }
    .task-label.doing { background:#FFF8E1; color:#7A5500; }
    .month-day-more { font-size:9px; color:var(--text-secondary); padding:0 2px; }
    .timeline-container { display:flex; flex-direction:column; max-height:600px; overflow-y:auto; }
    .timeline-header { display:flex; margin-left:140px; padding-bottom:6px; border-bottom:1px solid var(--border-color); position:sticky; top:0; background:white; z-index:1; }
    .timeline-hour { flex:1; font-size:10px; color:var(--text-secondary); text-align:center; }
    .timeline-row { display:flex; align-items:center; height:44px; border-bottom:1px solid #F0EDE6; }
    .timeline-row:last-child { border-bottom:none; }
    .timeline-task-name { width:140px; flex-shrink:0; font-size:12px; padding:0 10px 0 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .timeline-bars { flex:1; position:relative; height:100%; }
    .timeline-bar { position:absolute; top:7px; height:30px; border-radius:6px; cursor:pointer; display:flex; align-items:center; padding:0 8px; font-size:10px; overflow:hidden; white-space:nowrap; transition:filter 0.15s; }
    .timeline-bar:hover { filter:brightness(0.92); }
    .timeline-bar.has-doing { background:var(--soft-yellow); border:1px solid #FFD040; color:#7A6000; }
    .timeline-bar.no-doing { background:var(--timeline-gray); border:1px solid #CCC8C0; color:var(--text-secondary); }
    .bar-tooltip { display:none; position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%); background:var(--text-primary); color:white; padding:8px 12px; border-radius:8px; font-size:12px; white-space:nowrap; z-index:10; pointer-events:none; box-shadow:0 4px 12px rgba(0,0,0,.15); }
    .bar-tooltip::after { content:''; position:absolute; top:100%; left:50%; transform:translateX(-50%); border:5px solid transparent; border-top-color:var(--text-primary); }
    .timeline-bar:hover .bar-tooltip { display:block; }
    .timeline-empty { text-align:center; padding:40px; color:var(--text-secondary); font-size:14px; }
    .stat-cards { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:24px; }
    .stat-card { background:white; border-radius:16px; padding:18px; border:1px solid var(--border-color); text-align:center; }
    .stat-card .stat-number { font-size:32px; font-weight:700; }
    .stat-card .stat-label { font-size:13px; color:var(--text-secondary); margin-top:4px; }
    .stat-card:nth-child(1) .stat-number { color:var(--color-done); }
    .stat-card:nth-child(2) .stat-number { color:var(--color-doing); }
    .stat-card:nth-child(3) .stat-number { color:var(--blush-pink); }
    .bar-chart-wrapper,.today-tasks-wrapper { background:white; border-radius:16px; padding:20px; border:1px solid var(--border-color); margin-bottom:20px; }
    .bar-chart-wrapper h3,.today-tasks-wrapper h3 { font-size:16px; margin-bottom:16px; }
    .bar-chart { display:flex; flex-direction:column; gap:8px; }
    .bar-row { display:flex; align-items:center; gap:10px; }
    .bar-label { font-size:13px; color:var(--text-secondary); width:60px; text-align:right; flex-shrink:0; }
    .bar-track { flex:1; height:22px; background:var(--light-gray); border-radius:6px; overflow:hidden; position:relative; }
    .bar-fill { position:absolute; left:0; top:0; height:100%; background:var(--soft-yellow); border-radius:6px; transition:width 0.5s ease; }
    .bar-value { font-size:13px; font-weight:600; width:24px; flex-shrink:0; }
    .today-task { padding:10px 0; border-bottom:1px solid var(--light-gray); font-size:14px; }
    .today-task:last-child { border-bottom:none; }
    @media (max-width:768px) { .stat-cards { grid-template-columns:repeat(2,1fr); } .year-grid { grid-template-columns:repeat(2,1fr); } }
  </style>
</head>
<body>
  <div class="report-header">
    <h1>我的任务报告</h1>
    <div class="view-tabs">
      <button class="active" data-view="calendar">📅 日历</button>
      <button data-view="dashboard">📊 仪表盘</button>
    </div>
  </div>

  <div id="view-calendar" class="view-container active">
    <div class="cal-wrapper">
      <div class="cal-level-tabs">
        <button class="cal-level-btn active" data-level="year">年</button>
        <button class="cal-level-btn" data-level="month">月</button>
        <button class="cal-level-btn" data-level="day">日</button>
      </div>
      <div id="year-view" class="year-view">
        <div class="year-nav">
          <button id="cal-year-prev">◀ 上一年</button>
          <h2 id="cal-year-title"></h2>
          <button id="cal-year-next">下一年 ▶</button>
        </div>
        <div id="year-grid" class="year-grid"></div>
      </div>
      <div id="month-view" class="month-view">
        <div class="month-nav">
          <h2 id="cal-month-title"></h2>
          <div>
            <button id="cal-prev">◀ 上月</button>
            <button id="cal-next">下月 ▶</button>
          </div>
        </div>
        <div class="month-weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
        <div id="month-grid" class="month-grid"></div>
      </div>
      <div id="day-view" class="day-view">
        <div class="day-nav">
          <h2 id="cal-day-title"></h2>
          <div>
            <button id="cal-day-prev">◀ 前一天</button>
            <button id="cal-day-next">后一天 ▶</button>
          </div>
        </div>
        <div id="timeline-container" class="timeline-container"></div>
      </div>
    </div>
  </div>

  <div id="view-dashboard" class="view-container">
    <div class="stat-cards">
      <div class="stat-card"><div class="stat-number" id="stat-today">-</div><div class="stat-label">今日完成</div></div>
      <div class="stat-card"><div class="stat-number" id="stat-week">-</div><div class="stat-label">本周完成</div></div>
      <div class="stat-card"><div class="stat-number" id="stat-month">-</div><div class="stat-label">本月完成</div></div>
      <div class="stat-card"><div class="stat-number" id="stat-total">-</div><div class="stat-label">总计完成</div></div>
    </div>
    <div class="bar-chart-wrapper"><h3>📈 最近7天完成情况</h3><div id="bar-chart" class="bar-chart"></div></div>
    <div class="today-tasks-wrapper"><h3>📋 今日完成任务</h3><div id="today-tasks"></div></div>
  </div>

  <script>
    let calendarYear=new Date().getFullYear(), calendarMonth=new Date().getMonth(), calendarDay=new Date().toISOString().split('T')[0], monthCache={};

    function formatMs(ms) {
      if(!ms) return '未记录';
      const m=Math.round(ms/60000); if(m<60) return `${m}分钟`;
      const h=Math.floor(m/60),r=m%60; return r>0?`${h}小时${r}分`:`${h}小时`;
    }

    async function fetchStats(view,params) {
      try {
        let url=`/api/stats?view=${view}`;
        if(params) url+='&'+new URLSearchParams(params).toString();
        const res=await fetch(url); const json=await res.json();
        return json.success?json.data:null;
      } catch(e){return null;}
    }

    document.querySelectorAll('.view-tabs button').forEach(btn=>{
      btn.addEventListener('click',()=>{
        document.querySelectorAll('.view-tabs button').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.view-container').forEach(c=>c.classList.remove('active'));
        document.getElementById(`view-${btn.dataset.view}`).classList.add('active');
        if(btn.dataset.view==='calendar') switchCalLevel('year');
        if(btn.dataset.view==='dashboard') renderDashboard();
      });
    });

    function setLevelTab(level){document.querySelectorAll('.cal-level-btn').forEach(b=>b.classList.toggle('active',b.dataset.level===level));}
    function switchCalLevel(level){
      setLevelTab(level);
      if(level==='year'){resetCalendarView();renderYearView();}
      else if(level==='month'){showMonthView();renderMonthView();}
      else if(level==='day'){showDayView();renderDayView();}
    }
    document.querySelectorAll('.cal-level-btn').forEach(btn=>btn.addEventListener('click',()=>switchCalLevel(btn.dataset.level)));

    function resetCalendarView(){document.getElementById('year-view').classList.remove('hidden');document.getElementById('month-view').classList.remove('active');document.getElementById('day-view').classList.remove('active');setLevelTab('year');}
    function showMonthView(){document.getElementById('year-view').classList.add('hidden');document.getElementById('month-view').classList.add('active');document.getElementById('day-view').classList.remove('active');setLevelTab('month');}
    function showDayView(){document.getElementById('year-view').classList.add('hidden');document.getElementById('month-view').classList.remove('active');document.getElementById('day-view').classList.add('active');setLevelTab('day');}

    async function renderYearView(){
      document.getElementById('cal-year-title').textContent=`${calendarYear}年`;
      const grid=document.getElementById('year-grid'); grid.innerHTML='';
      const todayStr=new Date().toISOString().split('T')[0];
      const yearStats=await fetchStats('year'); const heatMap=yearStats?.heatMap||{};
      const monthNames=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
      for(let m=0;m<12;m++){
        const monthEl=document.createElement('div'); monthEl.className='mini-month';
        const header=document.createElement('div'); header.className='mini-month-header'; header.textContent=monthNames[m];
        header.addEventListener('click',()=>{calendarMonth=m;switchCalLevel('month');});
        monthEl.appendChild(header);
        const weekdays=document.createElement('div'); weekdays.className='mini-weekdays';
        ['一','二','三','四','五','六','日'].forEach(d=>{const s=document.createElement('span');s.textContent=d;weekdays.appendChild(s);});
        monthEl.appendChild(weekdays);
        const dates=document.createElement('div'); dates.className='mini-dates';
        const firstDay=new Date(calendarYear,m,1).getDay(), offset=firstDay===0?6:firstDay-1, daysInMonth=new Date(calendarYear,m+1,0).getDate();
        for(let i=0;i<offset;i++){const e=document.createElement('div');e.className='mini-date';e.style.visibility='hidden';dates.appendChild(e);}
        for(let d=1;d<=daysInMonth;d++){
          const el=document.createElement('div'); el.className='mini-date'; el.textContent=d;
          const dateStr=`${calendarYear}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          if(dateStr===todayStr) el.classList.add('today');
          const dayData=heatMap[dateStr];
          if(dayData?.count>0) el.classList.add(`heat-${Math.min(dayData.count,6)}`);
          // 所有日期都可以点击进入日视图
          el.addEventListener('click',()=>{calendarDay=dateStr;calendarMonth=m;switchCalLevel('day');});
          dates.appendChild(el);
        }
        monthEl.appendChild(dates); grid.appendChild(monthEl);
      }
    }

    document.getElementById('cal-year-prev').addEventListener('click',()=>{calendarYear--;renderYearView();});
    document.getElementById('cal-year-next').addEventListener('click',()=>{calendarYear++;renderYearView();});

    async function renderMonthView(){
      const monthStr=`${calendarYear}-${String(calendarMonth+1).padStart(2,'0')}`;
      document.getElementById('cal-month-title').textContent=`${calendarYear}年${calendarMonth+1}月`;
      let stats=monthCache[monthStr]||(monthCache[monthStr]=await fetchStats('month',{month:monthStr}));
      if(!stats) return;
      const grid=document.getElementById('month-grid'); grid.innerHTML='';
      const firstDay=new Date(calendarYear,calendarMonth,1).getDay(), offset=firstDay===0?6:firstDay-1, daysInMonth=new Date(calendarYear,calendarMonth+1,0).getDate();
      const todayStr=new Date().toISOString().split('T')[0];
      for(let i=0;i<offset;i++){const e=document.createElement('div');e.className='month-day empty';grid.appendChild(e);}
      for(let d=1;d<=daysInMonth;d++){
        const dayEl=document.createElement('div'); dayEl.className='month-day';
        const dateStr=`${calendarYear}-${String(calendarMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        if(dateStr===todayStr) dayEl.classList.add('today');
        const dayData=stats.calendarData?.[dateStr];
        let html=`<div class="month-day-num">${d}</div><div class="month-day-tasks">`;
        if(dayData?.tasks?.length>0){dayData.tasks.slice(0,4).forEach(t=>{html+=`<div class="task-label done" title="${t.text}">${t.text}</div>`;});if(dayData.tasks.length>4) html+=`<div class="month-day-more">+${dayData.tasks.length-4}</div>`;}
        html+='</div>'; dayEl.innerHTML=html;
        // 所有日期都可以点击
        dayEl.addEventListener('click',()=>{calendarDay=dateStr;switchCalLevel('day');});
        grid.appendChild(dayEl);
      }
    }

    document.getElementById('cal-prev').addEventListener('click',()=>{calendarMonth--;if(calendarMonth<0){calendarMonth=11;calendarYear--;}showMonthView();monthCache={};renderMonthView();});
    document.getElementById('cal-next').addEventListener('click',()=>{calendarMonth++;if(calendarMonth>11){calendarMonth=0;calendarYear++;}showMonthView();monthCache={};renderMonthView();});

    async function renderDayView(){
      const d=new Date(calendarDay+'T12:00:00');
      const weekdays=['周日','周一','周二','周三','周四','周五','周六'];
      document.getElementById('cal-day-title').textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${weekdays[d.getDay()]}`;
      const stats=await fetchStats('day',{date:calendarDay});
      const container=document.getElementById('timeline-container'); container.innerHTML='';
      const header=document.createElement('div'); header.className='timeline-header';
      for(let h=0;h<24;h++){const el=document.createElement('div');el.className='timeline-hour';if(h%3===0)el.textContent=`${String(h).padStart(2,'0')}:00`;header.appendChild(el);}
      container.appendChild(header);
      const body=document.createElement('div');
      if(!stats?.day?.tasks?.length){body.innerHTML='<div class="timeline-empty">🐶 这一天没有完成任务</div>';container.appendChild(body);return;}
      stats.day.tasks.forEach(t=>{
        const row=document.createElement('div'); row.className='timeline-row';
        const nameEl=document.createElement('div'); nameEl.className='timeline-task-name'; nameEl.textContent=t.text; nameEl.title=t.text; row.appendChild(nameEl);
        const barsEl=document.createElement('div'); barsEl.className='timeline-bars';
        const startTs=t.doing_at||t.created_at, endTs=t.done_at||(startTs+3600000);
        const startH=new Date(startTs).getHours()+new Date(startTs).getMinutes()/60;
        const endH=new Date(endTs).getHours()+new Date(endTs).getMinutes()/60;
        const bar=document.createElement('div'); bar.className=`timeline-bar ${t.doing_at?'has-doing':'no-doing'}`;
        bar.style.left=`${Math.max(0,(startH/24)*100)}%`; bar.style.width=`${Math.max(1,((endH-startH)/24)*100)}%`;
        if(((endH-startH)/24)*100>5) bar.textContent=t.text;
        const tooltip=document.createElement('div'); tooltip.className='bar-tooltip';
        tooltip.innerHTML=`<div style="font-weight:600;margin-bottom:4px;">${t.text}</div><div>⏱ Doing: ${formatMs(t.doingMs)}</div><div>📋 总耗时: ${formatMs(t.totalMs)}</div>`;
        bar.appendChild(tooltip); barsEl.appendChild(bar); row.appendChild(barsEl); body.appendChild(row);
      });
      container.appendChild(body);
    }

    document.getElementById('cal-day-prev').addEventListener('click',()=>{const d=new Date(calendarDay+'T12:00:00');d.setDate(d.getDate()-1);calendarDay=d.toISOString().split('T')[0];renderDayView();});
    document.getElementById('cal-day-next').addEventListener('click',()=>{const d=new Date(calendarDay+'T12:00:00');d.setDate(d.getDate()+1);calendarDay=d.toISOString().split('T')[0];renderDayView();});

    async function renderDashboard(){
      const stats=await fetchStats('dashboard'); if(!stats) return;
      document.getElementById('stat-today').textContent=stats.today.doneCount;
      document.getElementById('stat-week').textContent=stats.thisWeek.doneCount;
      document.getElementById('stat-month').textContent=stats.thisMonth.doneCount;
      document.getElementById('stat-total').textContent=stats.totalDone;
      const chartEl=document.getElementById('bar-chart'); chartEl.innerHTML='';
      const maxCount=Math.max(...stats.last7days.map(d=>d.count),1);
      stats.last7days.forEach(day=>{
        const date=new Date(day.date+'T12:00:00'), label=`${date.getMonth()+1}/${date.getDate()}`, pct=(day.count/maxCount)*100;
        const row=document.createElement('div'); row.className='bar-row';
        row.innerHTML=`<span class="bar-label">${label}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><span class="bar-value">${day.count}</span>`;
        chartEl.appendChild(row);
      });
      const tasksEl=document.getElementById('today-tasks');
      tasksEl.innerHTML=stats.today.todos?.length>0?stats.today.todos.map(t=>`<div class="today-task">✅ ${t.text}</div>`).join(''):'<p style="color:var(--text-secondary);text-align:center;padding:12px;">今天还没有完成任务 🐶</p>';
    }

    function connectWS(){
      const ws=new WebSocket('ws://localhost:3001');
      ws.onmessage=(e)=>{
        const msg=JSON.parse(e.data); if(msg.type!=='data-changed') return;
        const activeTab=document.querySelector('.view-tabs button.active')?.dataset.view;
        if(activeTab==='calendar'){
          if(document.getElementById('day-view').classList.contains('active')) renderDayView();
          else if(document.getElementById('month-view').classList.contains('active')){monthCache={};renderMonthView();}
          else renderYearView();
        } else if(activeTab==='dashboard') renderDashboard();
      };
      ws.onclose=()=>setTimeout(connectWS,3000);
      ws.onerror=()=>ws.close();
    }
    connectWS();
    window.addEventListener('focus',()=>{const t=document.querySelector('.view-tabs button.active')?.dataset.view;if(t==='dashboard') renderDashboard();});
    renderYearView();
  </script>
</body>
</html>
