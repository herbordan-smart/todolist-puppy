<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Puppy Todo · 桌面宠物端演示</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
:root { --yellow: #FFE566; --amber: #FFB800; --pink: #FFB5C8; --brown: #5C4A3A; --brown2: #A09080; --line: #EDE8DF; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; color: var(--brown); }
#desk { position: fixed; inset: 0; background: linear-gradient(135deg, #FFE9C9 0%, #FFD3DF 48%, #DCD6FF 100%); user-select: none; -webkit-user-select: none; }
.menubar { position: absolute; left: 0; right: 0; top: 0; height: 30px; background: rgba(255,255,255,.55); backdrop-filter: blur(10px); display: flex; align-items: center; gap: 18px; padding: 0 16px; font-size: 13px; z-index: 5; }
.menubar b { font-weight: 700; }
.menubar .sp { flex: 1; }
.fwin { position: absolute; background: rgba(255,255,255,.7); border-radius: 14px; box-shadow: 0 12px 30px rgba(120,90,60,.12); }
.fwin .tb { height: 26px; display: flex; gap: 6px; align-items: center; padding-left: 12px; }
.fwin .tb i { width: 9px; height: 9px; border-radius: 50%; background: rgba(92,74,58,.2); display: block; }
.fwin .l { height: 8px; border-radius: 4px; background: rgba(92,74,58,.12); margin: 12px 18px 0; }

.hint { position: absolute; left: 24px; top: 54px; width: 340px; background: rgba(255,253,245,.92); border: 1px solid var(--line); border-radius: 20px; padding: 20px 22px; box-shadow: 0 10px 30px rgba(120,90,60,.15); z-index: 4; }
.hint h1 { font-size: 20px; font-weight: 800; }
.hint p { font-size: 14px; color: var(--brown2); line-height: 1.7; margin-top: 6px; }
.hint ul { list-style: none; margin-top: 12px; }
.hint li { font-size: 14px; line-height: 1.6; padding: 6px 0 6px 20px; position: relative; }
.hint li::before { content: ''; position: absolute; left: 2px; top: 14px; width: 8px; height: 8px; border-radius: 50%; background: var(--yellow); }
.hint .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.btn { display: inline-block; padding: 8px 14px; border-radius: 12px; font-size: 13px; font-weight: 600; background: #F5F0E8; color: var(--brown); text-decoration: none; border: none; cursor: pointer; font-family: inherit; }
.btn.y { background: linear-gradient(135deg, #FFE566, #FFCD3C); color: #7A6000; }
.btn:hover { filter: brightness(.96); }
.hint .close { position: absolute; right: 12px; top: 10px; border: none; background: transparent; color: var(--brown2); font-size: 18px; cursor: pointer; }

#panel-wrap { position: absolute; width: 320px; height: 500px; display: none; z-index: 6; }
#panel-wrap iframe { width: 320px; height: 500px; border: none; background: transparent; color-scheme: normal; }
#panel-wrap.show { display: block; animation: pop .25s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes pop { from { opacity: 0; transform: scale(.9) translateY(10px); } to { opacity: 1; transform: none; } }

#puppy { position: absolute; width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 7; touch-action: none; }
#puppy-wrap { width: 110px; height: 110px; display: flex; align-items: center; justify-content: center; animation: idle-bob 3s ease-in-out infinite; transition: transform .15s ease; }
#puppy-img { width: 110px; height: 110px; object-fit: contain; pointer-events: none; filter: drop-shadow(0 4px 8px rgba(0,0,0,.15)); }
#puppy:hover #puppy-wrap { animation: hover-wiggle .5s ease-in-out; }
#puppy:active #puppy-wrap { transform: scale(.92); }
@keyframes idle-bob { 0%,100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-4px) rotate(1deg); } 75% { transform: translateY(-2px) rotate(-.5deg); } }
@keyframes hover-wiggle { 0% { transform: rotate(0); } 20% { transform: rotate(-8deg) scale(1.05); } 40% { transform: rotate(8deg) scale(1.05); } 60% { transform: rotate(-5deg); } 80% { transform: rotate(5deg); } 100% { transform: rotate(0); } }
#bubble { position: absolute; z-index: 8; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 6px 12px; font-size: 13px; box-shadow: 0 6px 18px rgba(120,90,60,.18); pointer-events: none; transition: opacity .3s; white-space: nowrap; }
#state { position: absolute; z-index: 4; right: 24px; top: 46px; background: rgba(255,253,245,.92); border: 1px solid var(--line); border-radius: 14px; padding: 8px 14px; font-size: 13px; }
#state b { color: #B77F00; }

#ctx { position: absolute; z-index: 20; display: none; min-width: 180px; background: rgba(255,255,255,.95); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 30px rgba(120,90,60,.22); padding: 6px; }
#ctx button { display: block; width: 100%; text-align: left; border: none; background: transparent; padding: 8px 12px; font-size: 14px; border-radius: 8px; cursor: pointer; font-family: inherit; color: var(--brown); }
#ctx button:hover { background: #FFF3C4; }
#ctx hr { border: none; border-top: 1px solid var(--line); margin: 4px 0; }
@media (max-width: 720px) { .hint { width: calc(100% - 32px); left: 16px; } #state { display: none; } }
</style>
</head>
<body>
<div id="desk">
  <div class="menubar"><span>&#128062;</span><b>Puppy Todo</b><span>文件</span><span>编辑</span><span>窗口</span><span class="sp"></span><span id="clock"></span></div>
  <div class="fwin" style="left:40%;top:120px;width:380px;height:240px"><div class="tb"><i></i><i></i><i></i></div><div class="l" style="width:60%"></div><div class="l" style="width:82%"></div><div class="l" style="width:70%"></div><div class="l" style="width:40%"></div></div>
  <div class="fwin" style="left:52%;top:260px;width:340px;height:200px;background:rgba(255,255,255,.5)"><div class="tb"><i></i><i></i><i></i></div><div class="l" style="width:50%"></div><div class="l" style="width:76%"></div><div class="l" style="width:62%"></div></div>

  <aside class="hint" id="hint">
    <button class="close" id="hint-close" title="关闭提示">×</button>
    <h1>桌面宠物端 · 在线演示</h1>
    <p>这是浏览器里的模拟桌面，界面与交互复用自真实的 Electron 应用。</p>
    <ul>
      <li><b>点击小狗</b>展开 / 收起任务面板</li>
      <li><b>点圆圈</b>切换任务状态，看小狗换表情</li>
      <li><b>拖动小狗</b>移动位置，面板跟随</li>
      <li><b>右键小狗</b>打开菜单</li>
      <li>添加任务：输入后点击「+」</li>
    </ul>
    <div class="btns">
      <a class="btn y" href="report.html" target="_blank">打开网页端报告</a>
      <button class="btn" id="reset">重置示例数据</button>
      <a class="btn" href="./">返回首页</a>
    </div>
  </aside>
  <div id="state"></div>

  <div id="panel-wrap"><iframe id="panel-frame" src="panel.html" title="任务面板"></iframe></div>
  <div id="puppy"><div id="puppy-wrap"><img id="puppy-img" src="dog-waiting.png" alt="puppy" draggable="false"/></div></div>
  <div id="bubble" style="opacity:0">点我试试</div>
  <div id="ctx">
    <button id="m-panel">打开任务栏</button>
    <button id="m-report">打开报告</button>
    <hr/>
    <button id="m-reset">重置示例数据</button>
  </div>
</div>

<script src="demo-shim.js"></script>
<script>
(function () {
  const puppy = document.getElementById('puppy');
  const img = document.getElementById('puppy-img');
  const panelWrap = document.getElementById('panel-wrap');
  const bubble = document.getElementById('bubble');
  const ctx = document.getElementById('ctx');
  const stateEl = document.getElementById('state');
  const frame = document.getElementById('panel-frame');
  const PW = 320, PH = 500, PUP = 120, MARGIN = 12;

  let gx = Math.max(10, innerWidth - 150), gy = Math.max(40, innerHeight - 150);
  let panelVisible = false;

  function place() {
    puppy.style.left = gx + 'px'; puppy.style.top = gy + 'px';
    let px = gx - PW - MARGIN;
    let py = gy + PUP - PH;
    if (px < 0) px = gx + PUP + MARGIN;
    if (py < 34) py = 34;
    if (py + PH > innerHeight) py = Math.max(34, innerHeight - PH);
    panelWrap.style.left = px + 'px'; panelWrap.style.top = py + 'px';
    bubble.style.left = Math.max(8, gx - 70) + 'px'; bubble.style.top = (gy - 36) + 'px';
  }
  function setPanel(v) {
    panelVisible = v;
    panelWrap.classList.remove('show');
    if (v) { void panelWrap.offsetWidth; panelWrap.classList.add('show'); place(); try { frame.contentWindow.location.reload(); } catch (e) {} }
    bubble.style.opacity = '0';
  }
  place();

  // drag / click (pointer events: mouse + touch)
  let down = false, moved = false, t0 = 0, sx = 0, sy = 0, ox = 0, oy = 0;
  puppy.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    down = true; moved = false; t0 = Date.now(); sx = e.clientX; sy = e.clientY; ox = gx; oy = gy;
    puppy.setPointerCapture(e.pointerId); e.preventDefault(); hideCtx();
  });
  puppy.addEventListener('pointermove', (e) => {
    if (!down) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
    if (moved) { gx = Math.min(innerWidth - PUP, Math.max(0, ox + dx)); gy = Math.min(innerHeight - PUP, Math.max(30, oy + dy)); place(); }
  });
  puppy.addEventListener('pointerup', () => {
    if (!down) return; down = false;
    if (!moved && Date.now() - t0 < 300) setPanel(!panelVisible);
  });
  puppy.addEventListener('contextmenu', (e) => { e.preventDefault(); showCtx(e.clientX, e.clientY); });

  function showCtx(x, y) { ctx.style.display = 'block'; ctx.style.left = Math.min(x, innerWidth - 200) + 'px'; ctx.style.top = Math.min(y, innerHeight - 140) + 'px'; }
  function hideCtx() { ctx.style.display = 'none'; }
  document.addEventListener('click', hideCtx);
  document.getElementById('m-panel').addEventListener('click', () => setPanel(!panelVisible));
  document.getElementById('m-report').addEventListener('click', () => window.open('report.html', '_blank'));
  function reset() { window.api.resetDemo(); try { frame.contentWindow.location.reload(); } catch (e) {} refresh(); }
  document.getElementById('m-reset').addEventListener('click', reset);
  document.getElementById('reset').addEventListener('click', reset);
  document.getElementById('hint-close').addEventListener('click', () => { document.getElementById('hint').style.display = 'none'; });

  window.addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.type === 'puppy:close-panel') setPanel(false);
    if (d.type === 'puppy:context-menu') { const r = panelWrap.getBoundingClientRect(); showCtx(r.left + 40, r.top + 60); }
  });
  window.addEventListener('resize', place);

  // puppy mood — same rules as puppy.js
  const stateMap = { working: 'dog-working.png', playing: 'dog-playing.png', ready: 'dog-ready.png', waiting: 'dog-waiting.png' };
  const label = { working: '工作中（有进行中的任务）', ready: '准备出发（有待办任务）', playing: '开心玩耍（今日已完成、无待办）', waiting: '安静等待（暂无任务）' };
  let last = null;
  function switchDog(s) {
    if (last === s) return; last = s;
    img.style.transition = 'opacity .3s ease'; img.style.opacity = '0';
    setTimeout(() => { img.src = stateMap[s]; img.style.opacity = '1'; }, 300);
    stateEl.innerHTML = '小狗状态：<b>' + label[s] + '</b>';
  }
  async function refresh() {
    const st = await window.api.getStatus();
    if (st.doingCount > 0) switchDog('working');
    else if (st.todoCount > 0) switchDog('ready');
    else if (st.todayDoneCount > 0) switchDog('playing');
    else switchDog('waiting');
  }
  refresh(); setInterval(refresh, 1000);

  function tick() { const d = new Date(); document.getElementById('clock').textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日  ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  tick(); setInterval(tick, 30000);

  setTimeout(() => { if (!panelVisible) bubble.style.opacity = '1'; }, 800);
  setTimeout(() => { bubble.style.opacity = '0'; }, 7000);
})();
</script>
</body>
</html>
